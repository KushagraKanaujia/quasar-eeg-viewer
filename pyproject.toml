[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-eeg-viewer"
version = "2.0.0"
description = "Interactive EEG/ECG visualization tool for brain waves, neural signals, and physiological data analysis"
readme = "README.md"
authors = [
    {name = "Kushagra Kanaujia", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
]
keywords = [
    "eeg", "ecg", "brain-waves", "neural-signals", "electroencephalography",
    "electrocardiography", "visualization", "neuroscience", "biomedical",
    "signal-processing", "plotly", "medical-imaging", "data-visualization",
    "sleep-study", "polysomnography", "brain-activity", "eeg-analysis",
    "10-20-system", "physiological-signals", "bci", "brain-computer-interface",
    "cardiac-monitoring", "eeg-viewer", "medical-data", "seizure-detection",
    "sleep-medicine", "neurology", "clinical-neuroscience", "erp", "event-related-potentials"
]
requires-python = ">=3.8"
dependencies = [
    "plotly>=5.15.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/KushagraKanaujia/quasar-eeg-viewer"
Documentation = "https://github.com/KushagraKanaujia/quasar-eeg-viewer#readme"
Repository = "https://github.com/KushagraKanaujia/quasar-eeg-viewer"
Issues = "https://github.com/KushagraKanaujia/quasar-eeg-viewer/issues"
Changelog = "https://github.com/KushagraKanaujia/quasar-eeg-viewer/blob/main/CHANGELOG.md"

[project.scripts]
quasar-eeg-viewer = "quasar_eeg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["quasar_eeg*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src/quasar_eeg",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/quasar_eeg"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
